name: Daily Surf Data Collection

on:
  schedule:
    # 台灣時間 09:14 (UTC 01:14)
    - cron: '14 1 * * *'
    # 台灣時間 14:15 (UTC 06:15)
    - cron: '15 6 * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: read

concurrency:
  group: surf-sheet-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run collection script
        env:
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          VERTEX_PROJECT_ID: "pelagic-gist-455209-e6"
          VERTEX_LOCATION: "us"
          VERTEX_ENDPOINT_ID: "3548132818926174208"
          SHEET_NAME: "Surf_AI_Dataset"
        run: python collect_data.py
